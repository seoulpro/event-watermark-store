name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.19.0"
          - "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - if: ${{ matrix.node-version == '20.19.0' }}
        run: npm run check:compat
      - if: ${{ matrix.node-version == '22' }}
        run: npm run check

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-tools
      - name: Verify Redis service health
        run: redis-cli PING | grep --fixed-strings --line-regexp PONG
      - name: Verify Redis service version
        run: redis-cli INFO server | grep --extended-regexp '^redis_version:7\.2\.'
      - run: EVENT_WATERMARK_REDIS_LIVE=1 npm run test:redis
