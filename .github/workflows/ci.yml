name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - "20.19"
          - "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - if: ${{ matrix.node-version == '20.19' }}
        run: npm run check:compat
      - if: ${{ matrix.node-version == '22' }}
        run: npm run check
